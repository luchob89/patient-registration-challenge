services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-patient_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-patient_pass}
      POSTGRES_DB: ${POSTGRES_DB:-patient_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-patient_user} -d ${POSTGRES_DB:-patient_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: packages/backend/Dockerfile
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-patient_user}:${POSTGRES_PASSWORD:-patient_pass}@db:5432/${POSTGRES_DB:-patient_db}
      PORT: 3001
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
